image: node:4.2.2

cache:
  paths:
   - node_modules/

stages:
  - build
  - deploy

minify:
  stage: build
  before_script:
  - npm install
  script:
  - gulp --production
  - mkdir .public
  - cp -r dist/* .public
  artifacts:
    paths:
    - .public
  only:
  - master

pages:
  stage: deploy
  dependencies:
  - minify
  script:
  - mv .public public
  artifacts:
    paths:
    - public
  only:
  - master
