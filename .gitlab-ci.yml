image: node:4.2.2

cache:
  paths:
   - node_modules/

stages:
  - build
  - deploy

Minification:
  stage: build
  before_script:
  - npm install
  - npm install gulp --global
  - npm install gulp --save-dev
  script:
  - gulp --production
  - mv dist .public
  artifacts:
    paths:
    - .public
  only:
  - master

pages:
  stage: deploy
  dependencies:
  - Minification
  script:
  - mv .public public
  artifacts:
    paths:
    - public
  only:
  - master
  environment:
    name: Production
